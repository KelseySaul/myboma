name: Daily jobs

# Render's free tier sleeps when idle and has no cron, so this wakes the service and runs the
# daily jobs through the authenticated /api/cron/daily endpoint. 05:00 UTC = 08:00 Nairobi.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/daily
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # A cold start on the free tier can take up to a minute.
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/daily"
