<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyBoma Property OS</title>
    <meta name="description" content="Property management workspace for landlords, tenants, hunters, and admins." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyBoma" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/webp" href="/bomalog.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="/bomalog.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    </noscript>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "16fe44a9-e285-4d7d-85f0-8b82014b9a71",
        });
      });
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        #initial-loader { display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: white; }
        @media (prefers-color-scheme: dark) { #initial-loader { background-color: #18181b; } }
        .loader-content { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
        .logo-image { height: 5rem; width: 5rem; object-fit: contain; border-radius: 1rem; background-color: white; padding: 0.5rem; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .brand-text { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
        .brand-title { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.05em; color: #18181b; text-transform: uppercase; font-family: system-ui, sans-serif; }
        @media (prefers-color-scheme: dark) { .brand-title { color: white; } }
        .brand-subtitle { font-size: 0.625rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.35em; color: #a1a1aa; font-family: system-ui, sans-serif; }
      </style>
      <div id="initial-loader">
        <div class="loader-content">
          <img src="/bomalog.webp" alt="myboma" class="logo-image" width="80" height="80" />
          <div class="brand-text">
            <span class="brand-title">myboma</span>
            <span class="brand-subtitle">Property OS</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
