        #initial-loader { display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: white; }

        .logo-image { height: 5rem; width: 5rem; object-fit: contain; border-radius: 1rem; background-color: white; padding: 0.5rem; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .brand-text { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
        .brand-title { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.05em; color: #18181b; text-transform: uppercase; font-family: system-ui, sans-serif; }
        @media (prefers-color-scheme: dark) { .brand-title { color: white; } }
        .brand-subtitle { font-size: 0.625rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.35em; color: #a1a1aa; font-family: system-ui, sans-serif; }

      <div id="initial-loader">

          <div class="brand-text">
