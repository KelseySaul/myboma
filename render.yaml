# Render Blueprint: one free-tier web service that serves the API and the built frontend.
# Secrets are marked sync: false and are entered in the Render dashboard, never committed.
services:
  - type: web
    name: myboma
    runtime: node
    plan: free
    region: frankfurt
    branch: platform-foundations
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Free instances sleep when idle, so daily jobs are triggered by
      # .github/workflows/daily-jobs.yml hitting /api/cron/daily instead of node-cron.
      - key: EXTERNAL_CRON
        value: "true"
      - key: APP_BASE_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_RLS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: my-boma
      - key: FIREBASE_PROJECT_ID
        value: myboma-c1c8b
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyDEQPcMzTbkWTy90bAmP-Qe6MaduziBTps
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: myboma-c1c8b.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: myboma-c1c8b
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: myboma-c1c8b.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "215421256507"
      - key: VITE_FIREBASE_APP_ID
        value: 1:215421256507:web:edab12e625a5893c59ad1e
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: G-QP7T3HCSPF
      - key: ONESIGNAL_REST_API_KEY
        sync: false
      - key: PESAPAL_ENV
        value: production
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_CURRENCY
